<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071113" />
    <title>Reconnect · Lyra</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #071113;
        color: #e5f5f7;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 380px;
        padding: max(32px, env(safe-area-inset-top)) 28px max(32px, env(safe-area-inset-bottom));
      }
      img {
        width: 48px;
        height: 48px;
        object-fit: contain;
      }
      h1 {
        font-size: 30px;
        font-weight: 500;
        letter-spacing: -0.04em;
      }
      p {
        color: #8aa9ae;
        line-height: 1.8;
        font-size: 15px;
      }
      button {
        margin-top: 16px;
        min-height: 44px;
        border: 0;
        border-radius: 10px;
        background: #67e8f9;
        color: #071113;
        padding: 12px 22px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #67e8f9;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.png" alt="Lyra" width="48" height="48" />
      <h1>A moment to reconnect.</h1>
      <p>You’re offline. Reconnect to open your conversations and continue exploring.</p>
      <p>Research you’ve already started continues in your workspace.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
